name: Publish reviewed library to GitHub Pages (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Only after Firebase Rules and changes are approved: type DEPLOY HT ENGLISH LIBRARY'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY HT ENGLISH LIBRARY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build && npm run check:catalog && npm run test:prepare
      - run: python3 -m pip install playwright==1.58.0
      - run: python3 -m playwright install --with-deps chromium
      - run: npm run test:emulators
      - run: node tools/prepare-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
  publish:
    needs: prepare
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
