name: Truc Tuan Grade 8 game (no deploy)
on:
  push:
    branches: [experiment/truc-tuan-grade8-game]
  pull_request:
    paths:
      - 'grade-8/De_thi_GHK1/1_THCS Truc Tuan/**'
      - 'tests/truc-tuan-game-browser.py'
      - 'tools/extract-truc-tuan-game.py'
      - '.github/workflows/truc-tuan-game-checks.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Five-question regression
        run: python tests/truc-tuan-game-browser.py --pilot
        env:
          GAME_TEST_OUTPUT: ${{ runner.temp }}/truc-tuan-game
      - name: Full original exam
        run: python tests/truc-tuan-game-browser.py
        env:
          GAME_TEST_OUTPUT: ${{ runner.temp }}/truc-tuan-game
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truc-tuan-game-browser-reports
          path: ${{ runner.temp }}/truc-tuan-game
