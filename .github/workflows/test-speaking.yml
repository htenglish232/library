name: Test Speaking checks and downloadable preview
on:
  push:
    branches: [feature/test-speaking-library]
  pull_request:
    paths: ['test-speaking/**', 'speaking-cards/**', 'index.html', 'assets/test-speaking-entry.css', 'tools/prepare-site.mjs', '.github/workflows/test-speaking.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --test test-speaking/tests/*.test.mjs
      - run: npm run check:catalog && npm run test:prepare
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Find installed Chromium
        run: python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - run: python test-speaking/tests/browser.py
      - run: python test-speaking/tests/unit5-browser.py
      - run: python test-speaking/tests/library-navigation.py
      - run: node tools/prepare-site.mjs
      - name: Verify packaged navigation
        run: HT_LIBRARY_SERVE_ROOT="$PWD/.site" python test-speaking/tests/library-navigation.py
      - uses: actions/upload-artifact@v4
        with:
          name: test-speaking-library-preview
          path: .site
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-speaking-browser-reports
          path: |
            /tmp/ht-speaking-cards
            /tmp/ht-speaking-unit5
            /tmp/ht-test-speaking-library
