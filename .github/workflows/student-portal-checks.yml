name: Student Portal isolated Emulator checks
on:
  pull_request:
    paths: ['student-portal/**', 'tools/*student*', 'tools/firebase-loopback-proxy.cjs', 'firebase.student-portal.json', '.github/workflows/student-portal-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            student-portal/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm ci --prefix student-portal/functions
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Find Chromium
        run: python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - run: npm run test:student:emulators
      - run: npm run check:catalog && npm run test:prepare && node --test test-speaking/tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-portal-test-screenshots
          path: |
            /tmp/ht-student-portal/*.png
            /tmp/ht-student-portal/browser-report.json
          if-no-files-found: ignore
