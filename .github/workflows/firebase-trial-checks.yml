name: Firebase trial checks (no deploy)
on:
  push:
    branches: [firebase-auth-trial, restore-firebase-auth, restore/firebase-integration-20261023, feature/grade8-school-exam-numbering, feature/grade67-school-exam-numbering, feature/add-truc-tuan-dual-game-to-library]
  pull_request:
    paths: ['assets/**', 'catalog/**', 'tests/**', 'tools/**', 'firestore.rules', 'firestore.indexes.json', 'firebase.json', 'package*.json', 'index.html', 'admin.html', '.github/workflows/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 tools/verify-firebase-recovery.py
      - run: npm run build && npm run check:catalog && npm run test:prepare
      - run: python3 -m pip install playwright==1.58.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/grade8-numbering-browser.py
      - run: python3 tests/grade67-numbering-browser.py
      - run: npm run test:emulators
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-numbering-browser
          path: |
            /tmp/ht-grade8-numbering
            /tmp/ht-grade67-numbering
