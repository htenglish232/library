name: Grade 6 and 8 dual-mode games (no deploy)
on:
  push:
    branches: [feature/grade8-dual-mode-games, feature/grade8-all-dual-mode-games, feature/grade8-dual-game-sounds, fix/grade8-shared-sound-loading, feature/grade6-all-dual-mode]
  pull_request:
    paths:
      - 'grade-8/De_thi_GHK1/**'
      - 'grade-6/De_thi_GHK_1/**'
      - 'assets/grade6-dual-links.js'
      - 'assets/catalog-release.js'
      - 'catalog/current-library-catalog.json'
      - 'tests/grade6-*'
      - 'tools/grade6-*'
      - 'docs/grade6-dual-mode/**'
      - 'assets/grade8-dual-links.js'
      - 'tests/dual-mode-*'
      - 'tests/grade8-all-dual*'
      - 'tools/grade8-source-*'
      - 'tools/audit-grade8-sound-loading.py'
      - 'tests/sound-bootstrap-contract.mjs'
      - 'docs/grade8-all-dual-mode/**'
      - 'docs/grade8-sound-loading/**'
      - 'tools/*dual*'
      - 'docs/grade8-dual-mode/**'
      - '.github/workflows/grade8-dual-mode-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - name: Preserve the original Stage 1 scope when testing that snapshot
        if: ${{ hashFiles('docs/grade8-all-dual-mode/inventory.json') == '' }}
        run: python tools/verify-dual-mode-preservation.py
      - name: Verify all-game sources and immutable original resources
        if: ${{ hashFiles('docs/grade8-all-dual-mode/inventory.json') != '' }}
        run: |
          python tools/build-grade8-dual-games.py --verify
          node --test tests/grade8-all-dual.test.mjs
      - name: Play all Grade 8 games
        if: ${{ hashFiles('docs/grade8-all-dual-mode/inventory.json') != '' }}
        run: python tests/grade8-all-dual-browser.py
        env:
          GRADE8_DUAL_REPORT: /tmp/grade8-all-dual-browser.json
      - name: Verify Grade 6 source adapters, catalog release and source preservation
        run: |
          python tools/build-grade6-dual-games.py --verify
          node --test tests/grade6-dual.test.mjs
          node tools/check-catalog.mjs
      - run: python tests/grade6-all-dual-browser.py
      - run: python tests/grade6-catalog-browser.py
      - run: python tests/grade6-cross-grade-browser.py
      - run: python tests/dual-mode-wav-browser.py
      - run: python tools/verify-truc-tuan-dual-source.py
      - run: node --test tests/dual-mode-progress.test.mjs tests/dual-mode-sound.test.mjs
      - run: python tools/audit-grade8-sound-loading.py
      - run: python tests/dual-mode-sound-loading-browser.py
      - run: python tests/dual-mode-sound-browser.py
      - run: python tests/dual-mode-browser.py
      - run: python tools/build-dual-mode-preview.py /tmp/ht-dual-mode-review-package
      - uses: actions/upload-artifact@v4
        with:
          name: truc-tuan-dual-mode-preview
          path: /tmp/ht-dual-mode-review-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truc-tuan-dual-mode-test-report
          path: |
            /tmp/ht-dual-mode-tests
            /tmp/grade8-all-dual-browser.json
            /tmp/grade6-all-dual-browser.json
            /tmp/grade6-cross-grade-browser.json
            /tmp/ht-grade6-catalog
            /tmp/ht-shared-wav-tests
            /tmp/ht-dual-sound-tests
            /tmp/ht-sound-loading-tests
