let state={name:'',cls:'',mode:'practice',answers:{},locked:{},submitted:false,session:0},page=0,zoom=1;
const $=id=>document.getElementById(id), automatic=Q.filter(q=>q.kind!=='manual');
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.name)state=s}catch(e){}}
function start(){if(!$('name').value.trim()){alert('Vui lòng nhập họ và tên.');return}state={name:$('name').value.trim(),cls:$('cls').value.trim(),mode:$('mode').value,answers:{},locked:{},submitted:false,session:Date.now()};save();show()}
function show(){if(!state.name)return;$('start').classList.add('hidden');$('work').classList.remove('hidden');$('who').textContent=state.name+' · '+(state.mode==='practice'?'Luyện tập':'Kiểm tra');$('pagepick').innerHTML=IMAGES.map((_,i)=>'<option value="'+i+'">Trang '+(i+1)+'</option>').join('');$('audios').innerHTML=AUDIOS.map((src,i)=>'<label>'+(i===3?'Audio bổ sung - Listen and circle':'Task '+(i+1))+' <audio controls preload="none" src="'+src+'"></audio></label>').join('');document.querySelectorAll('audio').forEach(a=>a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(b=>{if(b!==a)b.pause()})));render()}
function render(){page=Math.max(0,Math.min(IMAGES.length-1,page));$('pagepick').value=page;const qs=Q.filter(q=>q.page===page);let s='<div class="page" style="width:'+Math.round(100*zoom)+'%;max-width:'+Math.round(850*zoom)+'px"><img draggable="false" src="'+IMAGES[page]+'">';for(const q of qs){q.pts.forEach((p,i)=>{const val=q.kind==='choice'?q.options[i]:q.kind==='manual'?'GV':(state.answers[q.id]||'＋');const selected=state.answers[q.id]===val;const graded=state.submitted||(state.mode==='practice'&&state.locked[q.id]);const color=graded&&q.kind!=='manual'&&selected?(state.answers[q.id]===q.answer?' correct':' wrong'):selected?' selected':'';s+='<button aria-label="'+q.id+' '+val+'" title="'+q.id+'" class="hot '+(q.kind==='manual'?'manual':'')+color+'" style="left:'+p[0]+'%;top:'+p[1]+'%" onclick="tap(\''+q.id+'\','+i+')">'+(q.kind==='choice'?(selected?'✓':'○'):(q.kind==='manual'?'GV':val))+'</button>'})}s+='</div><div class="page-number">Trang '+(page+1)+' / '+IMAGES.length+'</div>';$('viewer').innerHTML=s;const done=automatic.filter(q=>state.answers[q.id]!=null).length;$('status').textContent='Đã làm '+done+'/'+automatic.length+' · '+(state.mode==='practice'?'Luyện tập':'Kiểm tra');$('submit').textContent=state.submitted?'XEM KẾT QUẢ':state.mode==='exam'?'NỘP BÀI':'XEM KẾT QUẢ';if(state.submitted)results(false)}
function tap(id,index){const q=Q.find(x=>x.id===id);if(q.kind==='manual'){alert('Câu Speaking cần giáo viên trực tiếp đánh giá; không tính vào điểm tự động.');return}if(state.submitted||state.locked[id]){feedback(q);return}if(q.kind==='choice'){choose(q,q.options[index]);return}let choices=q.options.map(v=>'<button onclick="chooseById(\''+id+'\','+JSON.stringify(v).replaceAll('"','&quot;')+')">'+v+'</button>').join('');popup('<h3>'+id+' · Chọn đáp án</h3><div class="options">'+choices+'</div><button class="secondary" onclick="closePopup()">Hủy</button>')}
function chooseById(id,v){closePopup();choose(Q.find(q=>q.id===id),v)}function choose(q,v){if(q.kind==='number'){for(const other of Q.filter(x=>x.kind==='number'&&x.id!==q.id)){if(state.answers[other.id]===v&&!state.locked[other.id])delete state.answers[other.id]}}state.answers[q.id]=v;if(state.mode==='practice')state.locked[q.id]=true;save();render();if(state.mode==='practice')feedback(q)}
function feedback(q){if(!state.submitted&&!state.locked[q.id])return;const val=state.answers[q.id],correct=val===q.answer;$('feedback').classList.remove('hidden');$('feedback').textContent=(correct?'CHÍNH XÁC!':'CHƯA CHÍNH XÁC!')+'\n'+q.id+' · Đã chọn: '+(val||'Chưa làm')+' · Đáp án đúng: '+q.answer+'\nGiải thích: '+q.ex+'\nDịch: '+q.translation;window.scrollTo({top:0,behavior:'smooth'})}
function popup(content){$('dialog').innerHTML=content;$('modal').classList.remove('hidden')}function closePopup(){$('modal').classList.add('hidden')}
function submit(){if(state.submitted){results(true);return}const missing=automatic.filter(q=>state.answers[q.id]==null).length;if(state.mode==='exam'){popup('<h3>Xác nhận nộp bài</h3><p>Bạn còn '+missing+' câu chưa hoàn thành. Sau khi nộp, bạn không thể sửa đáp án.</p><button class="secondary" onclick="closePopup()">TIẾP TỤC LÀM BÀI</button> <button onclick="finish()">XÁC NHẬN NỘP BÀI</button>')}else if(missing){popup('<h3>Còn '+missing+' câu chưa làm</h3><p>Bạn có thể xem kết quả tạm thời hoặc tiếp tục làm bài.</p><button class="secondary" onclick="closePopup()">TIẾP TỤC</button> <button onclick="closePopup();results(true)">XEM ĐIỂM TẠM THỜI</button>')}else finish()}
function finish(){closePopup();state.submitted=true;save();render();results(true)}function results(scroll){const done=automatic.filter(q=>state.answers[q.id]!=null),right=done.filter(q=>state.answers[q.id]===q.answer).length;const score=(right/automatic.length*10).toFixed(1);$('result').classList.remove('hidden');$('result').innerHTML='<h2>KẾT QUẢ · '+score+'/10</h2><div class="result"><b>'+state.name+'</b> · '+state.cls+'<br>Đúng: '+right+' · Sai: '+(done.length-right)+' · Bỏ trống: '+(automatic.length-done.length)+'<br>Đã trả lời: '+done.length+'/'+automatic.length+'<br>Speaking: 10 câu cần giáo viên đánh giá riêng.</div><p class="notice">Điểm chỉ tính 32 mục Listening và Reading & Writing; không bao gồm Speaking.</p>'+(state.submitted?'<p>Nhấn vào từng câu trên đề để xem giải thích và bản dịch.</p>':'<p>Điểm tạm thời, chưa khóa bài.</p>');if(scroll)$('result').scrollIntoView({behavior:'smooth'})}
function reset(){popup('<h3>Làm lại từ đầu?</h3><p>Toàn bộ đáp án và kết quả của lượt làm bài hiện tại sẽ bị xóa.</p><button class="secondary" onclick="closePopup()">HỦY</button> <button onclick="confirmReset()">XÁC NHẬN LÀM LẠI</button>')}
function confirmReset(){closePopup();document.querySelectorAll('audio').forEach(a=>a.pause());localStorage.removeItem(KEY);state={name:'',cls:'',mode:'practice',answers:{},locked:{},submitted:false,session:0};page=0;zoom=1;$('viewer').innerHTML='';$('result').classList.add('hidden');$('feedback').classList.add('hidden');$('work').classList.add('hidden');$('start').classList.remove('hidden');$('name').value='';$('cls').value='';window.scrollTo(0,0)}
$('begin').onclick=start;$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('pagepick').onchange=e=>{page=+e.target.value;render()};$('zoomin').onclick=()=>{zoom=Math.min(1.8,zoom+.2);render()};$('zoomout').onclick=()=>{zoom=Math.max(.7,zoom-.2);render()};$('submit').onclick=submit;$('reset').onclick=reset;load();if(state.name)show();
