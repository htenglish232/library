<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HT English - de-2</title></head><body><p id="status" style="font:18px system-ui;padding:24px">Đang mở de-2…</p><script>(async()=>{try{const paths=Array.from({length:10},(_,i)=>'de-2-parts/part-'+String(i+1).padStart(2,'0')+'.txt');const pieces=await Promise.all(paths.map(async path=>{const r=await fetch(path);if(!r.ok)throw Error('Không tải được '+path);return r.text()}));document.open();document.write(pieces.join(''));document.close()}catch(err){document.getElementById('status').textContent='Không mở được đề thi: '+err.message;console.error(err)}})();</script></body></html>
