#report{width:min(760px,96vw);max-width:96vw;max-height:88vh;padding:0;overflow:auto;overscroll-behavior:contain}#reportBody{padding:0 18px 12px}#report>.action{margin:0 18px 18px}.reportHead{position:sticky;top:0;z-index:3;background:#f5faff;margin:0 -18px 16px;padding:12px 18px;border-bottom:1px solid #cbddeb;box-shadow:0 3px 8px #16365312}.reportIdentity{display:flex;align-items:center;gap:10px}.reportIdentity img{width:64px;height:auto;flex:none}.reportIdentity p,.reportInfo p{margin:3px 0;overflow-wrap:anywhere}.reportIdentity strong{font-size:18px}.reportIdentity p{font-size:12px}.reportUnit{font-size:14px;margin:8px 0}.reportGrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.reportInfo{font-size:14px}.redGrade{color:#c51d29;transform:rotate(-7deg);font:700 clamp(58px,10vw,96px)/.95 ReportHand,cursive;text-align:center;min-width:100px}.redGrade svg{display:block;width:100%;height:22px;overflow:visible}.redGrade path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-dasharray:150;stroke-dashoffset:0}.teacherComment{font:700 clamp(18px,3vw,26px)/1.1 ReportHand,cursive;color:#c51d29;text-align:right;margin:5px 0 0}.writeOnce .gradeInk{animation:gradeWrite .7s linear both}.writeOnce path{animation:underlineWrite .18s .7s linear both}.writeOnce path+path{animation-delay:.88s}@keyframes gradeWrite{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}@keyframes underlineWrite{from{stroke-dashoffset:150}to{stroke-dashoffset:0}}#reportBody>p{white-space:pre-line;line-height:1.5}@media(max-width:500px){#reportBody{padding:0 12px 10px}.reportHead{margin:0 -12px 12px;padding:8px 12px}.reportIdentity img{width:42px}.reportIdentity strong{font-size:15px}.reportUnit,.reportInfo{font-size:12px}.redGrade{min-width:70px;font-size:58px}.redGrade svg{height:15px}.teacherComment{font-size:18px}.reportGrid{gap:5px}}@media(prefers-reduced-motion:reduce){.writeOnce .gradeInk,.writeOnce path{animation:none}}

.underline{border-bottom:3px solid currentColor}.word{font-size:clamp(8px,2.7cqw,25px);white-space:nowrap;text-align:center;overflow:hidden}
.menu{overflow:auto;max-height:45vh;overscroll-behavior:contain}
.order-bank,.order-line{grid-column:1/-1}.order-bank{display:flex;flex-wrap:wrap;gap:5px}.order-line{margin:4px;min-height:26px;display:flex;gap:5px;flex-wrap:wrap}.order-line button{background:#dceafb}.menu button:disabled{opacity:.42}.menu form{grid-column:1/-1;display:flex;gap:5px}
.page img{aspect-ratio:auto}
.worksheet-input{position:absolute;pointer-events:auto;appearance:none;min-width:0;max-width:none;padding:0;border:0;border-radius:3px;background:transparent;text-align:center;font-size:clamp(10px,2.7cqw,25px);font-weight:700;color:#1767b5}

<script>
'use strict';
const DATA=%%DATA%%, {pages:PAGES,questions:QUESTIONS,targets:TARGETS}=DATA;
const KEY=DATA.key, $=id=>document.getElementById(id), fresh=()=>({name:'',cls:'',teacher:'',mode:'practice',answers:{},started:false,submitted:false,result:null,page:0});let STATE=fresh();try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.answers)STATE={...STATE,...s}}catch(e){};

const views = {}, reviewInputs = {}, layers = [], svgs = [], targetButtons = [];
const svgNS = 'http://www.w3.org/2000/svg';
let pending = null, menu = null, timer;
const normalized = value => (value || '').normalize('NFKC').toLowerCase().trim().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').replace(/\s+([.,!?])/g, '$1').replace(/[.!?]$/, '');
function correct(q, value) {
  return (Array.isArray(q.ans) ? q.ans : [q.ans]).some(answer => normalized(answer) === normalized(value));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(STATE))}catch(e){$('storage').hidden=false}}
function pos(el, page, [x, y, w, h]) {
  const {width, height} = PAGES[page];
  Object.assign(el.style,{left:x/width*100+'%',top:y/height*100+'%',width:w/width*100+'%',height:h/height*100+'%'});
}
function notify(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3600)}
function allowed(){return STATE.started && !STATE.submitted}
function closeMenu(){if(menu){menu.remove();menu=null}}
document.addEventListener('click',e=>{if(menu&&!menu.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
window.addEventListener('resize',closeMenu);

function hideFeedback(){
  $('feedback').hidden = true;
  document.body.classList.remove('feedback-open');
  activeQuestionId = null;
}
let activeQuestionId = null;
function activate(q) {
  if (activeQuestionId !== q.id && STATE.mode === 'practice' && !STATE.submitted) hideFeedback();
  activeQuestionId = q.id;
}
function showFeedback(q,v){
  if (STATE.mode !== 'practice' && !STATE.submitted) return;
  activeQuestionId = q.id;
  const ok = correct(q,v);
  $('feedbackTitle').className = ok?'good':'bad';
  $('feedbackTitle').textContent = !v?'Chưa trả lời':ok?'✓ Chính xác! Em làm tốt lắm!':STATE.submitted?'✗ Chưa đúng':'✗ Chưa đúng – Em thử sửa nhé!';
  $('feedbackText').textContent = (!ok&&v?('Em trả lời '+v+'.\n'):'')+q.explanation;
  $('feedback').hidden=false;
  document.body.classList.add('feedback-open');
  $('feedback').scrollTop=0;
}
function hit(page, rect, label, fn){
  const button=document.createElement('button');
  button.type='button';button.className='hit';button.setAttribute('aria-label',label);
  pos(button,page,rect);
  button.onclick=e=>{e.stopPropagation();fn(button)};
  layers[page].append(button);
  return button;
}
function mark(q, rect, kind){
  const el=document.createElement('span');
  el.className='mark '+kind;
  el.setAttribute('aria-hidden','true');
  pos(el,q.page,rect);
  layers[q.page].append(el);
  return el;
}
function choose(q, value){
  if(!allowed())return;
  if(value && q.group && QUESTIONS.some(other=>other.id!==q.id && other.group===q.group && normalized(STATE.answers[other.id])===normalized(value))){
    notify('Em hãy xóa từ đã dùng trước khi chuyển sang chỗ khác.');
    return;
  }
  if(value) STATE.answers[q.id]=value;
  else delete STATE.answers[q.id];
  update(q);progress();save();
  if(value)showFeedback(q,value);
  else hideFeedback();
}
function popup(q,b){
  closeMenu();menu=document.createElement('div');menu.className='menu';menu.setAttribute('role','group');menu.setAttribute('aria-label',q.id);
  const current = STATE.answers[q.id] || '';

  if(q.kind==='order'){
    const bank=document.createElement('div');
    bank.className='order-bank';
    const line=document.createElement('div');
    line.className='order-line';line.setAttribute('aria-live','polite');
    const undo=document.createElement('button');undo.textContent='Lùi một từ';
    const confirm=document.createElement('button');confirm.textContent='Xác nhận';
    const selected=[];
    const buttons=q.choices.map((token,i)=>{
      const button=document.createElement('button');
      button.textContent=token;button.dataset.orderToken=String(i);
      button.onclick=e=>{e.stopPropagation();selected.push(i);render()};
      bank.append(button);
      return button;
    });
    function render(){
      buttons.forEach((button,i)=>button.disabled=selected.includes(i));
      line.replaceChildren();
      if(!selected.length)line.textContent='Chọn các từ theo đúng thứ tự.';
      selected.forEach((i,position)=>{
        const word=document.createElement('button');
        word.textContent=q.choices[i];word.setAttribute('aria-label','Bỏ '+q.choices[i]+' ở vị trí '+(position+1));
        word.onclick=e=>{e.stopPropagation();selected.splice(position,1);render()};
        line.append(word);
      });
      undo.disabled=selected.length===0;confirm.disabled=selected.length!==q.choices.length;
    }
    undo.onclick=e=>{e.stopPropagation();selected.pop();render()};
    confirm.onclick=e=>{e.stopPropagation();choose(q,selected.map(i=>q.choices[i]).join(' '));closeMenu();b.focus({preventScroll:true})};
    menu.append(bank,line,undo,confirm);
    render();
  }else if(q.kind==='entry'){

    const form=document.createElement('form');
    const input=document.createElement('input');
    input.setAttribute('aria-label','Câu trả lời cho '+q.id);input.value=current;input.autocomplete='off';input.maxLength=160;
    const submit=document.createElement('button');submit.textContent='Xác nhận';
    form.append(input,submit);
    form.onsubmit=e=>{e.preventDefault();choose(q,input.value.trim());closeMenu();b.focus({preventScroll:true})};
    menu.append(form);
  }else{
    for(const value of [...q.choices,'']){
      const button=document.createElement('button');
      button.textContent=value||'Xóa';
      button.setAttribute('aria-pressed',String(current===value && Boolean(value)));
      button.onclick=e=>{e.stopPropagation();choose(q,value);closeMenu();b.focus({preventScroll:true})};
      menu.append(button);
    }
  }
  document.body.append(menu);
  const r=b.getBoundingClientRect(),m=menu.getBoundingClientRect(), side=$('studySide').getBoundingClientRect();
  const bottom=(innerWidth<1200&&side.top>0)?Math.min(innerHeight,side.top):innerHeight;
  menu.style.left=Math.max(8,Math.min(r.left,innerWidth-m.width-8))+'px';
  menu.style.top=Math.max(8,Math.min(bottom-m.height-8,r.bottom+3))+'px';
  menu.firstElementChild.querySelector('input')?.focus({preventScroll:true});
  if(q.kind!=='entry')menu.querySelector('button:enabled')?.focus({preventScroll:true});
}
function removePending(){
  if(!pending)return;
  views[pending.id].buttons[0].classList.remove('pending');pending=null;
}
function interact(q, button, value) {
  if(STATE.submitted){closeMenu();showFeedback(q,STATE.answers[q.id]);return}
  if(!allowed())return;
  activate(q);closeMenu();
  if(q.kind==='match'){
    const same=pending?.id===q.id;
    removePending();
    if(same){choose(q,'');return}
    pending=q;button.classList.add('pending');notify('Bấm chấm tròn tương ứng ở bên phải.');
  }else{
    removePending();
    if(q.kind==='word'||q.kind==='entry'||q.kind==='order')popup(q,button);
    else choose(q,STATE.answers[q.id]===value?'':value);
  }
}

function directInput(q){
  const input=document.createElement('input');
  input.type='text';input.className='worksheet-input';input.maxLength=80;
  input.autocomplete='off';input.spellcheck=false;input.setAttribute('autocapitalize','off');
  input.setAttribute('aria-label',q.id+' nhập trực tiếp');
  pos(input,q.page,q.rect);
  input.onfocus=()=>{
    if(STATE.submitted){showFeedback(q,STATE.answers[q.id]);return}
    closeMenu();removePending();activate(q);
  };
  input.oninput=()=>{
    if(STATE.submitted)return;
    STATE.drafts ||= {};
    STATE.drafts[q.id]=input.value;
    input.classList.remove('good','bad');
    hideFeedback();
    save();
  };
  input.onblur=()=>{
    if(STATE.submitted||!Object.hasOwn(STATE.drafts||{},q.id))return;
    const value=input.value.trim();delete STATE.drafts[q.id];
    choose(q,value);
  };
  input.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();input.blur()}
  };
  layers[q.page].append(input);
  return input;
}

function init(){
  PAGES.forEach(({src,width,height},i)=>{
    const p=document.createElement('section');p.className='page';p.hidden=true;
    const img=document.createElement('img');img.src=src;img.width=width;img.height=height;img.alt='Trang '+(i+1)+' của bài tập gốc';p.append(img);
    const svg=document.createElementNS(svgNS,'svg');svg.setAttribute('viewBox','0 0 '+width+' '+height);svg.classList.add('lines');svg.setAttribute('aria-hidden','true');p.append(svg);svgs.push(svg);
    const layer=document.createElement('div');layer.className='layer';p.append(layer);layers.push(layer);$('pages').append(p);
  });
  for(const q of QUESTIONS){
    const view=views[q.id]={buttons:[],marks:[]};
    if(q.kind==='direct'){view.input=directInput(q)}else if(q.kind==='match'){
      const [x,y]=q.from;
      view.buttons.push(hit(q.page,[x-24,y-24,48,48],q.id+' chấm nối',b=>interact(q,b)));
      const line=document.createElementNS(svgNS,'line');line.setAttribute('x1',x);line.setAttribute('y1',y);
      line.setAttribute('stroke-width','4');line.setAttribute('stroke-linecap','round');
      svgs[q.page].append(line);view.line=line;
    }else if(q.kind==='word'||q.kind==='entry'||q.kind==='order'){
      view.buttons.push(hit(q.page,q.rect,q.id+' điền vào chỗ trống',b=>interact(q,b)));
      for(const rect of q.cells || [q.rect])view.marks.push(rect ? mark(q,rect,q.cells?'letter':'word') : null);
      if(q.extra_slot){
        view.buttons.push(hit(q.page,q.extra_slot,q.id+' ô chữ',b=>interact(q,b)));
        view.lineAnswer=mark(q,q.rect,'word');
      }
    }else{
      for(const [value,rect,ink] of q.opts){
        view.buttons.push(hit(q.page,rect,q.id+' '+value,b=>interact(q,b,value)));
        view.marks.push(mark(q,ink||rect,q.kind));
      }
    }
  }
  for(const [name,group] of Object.entries(TARGETS)){
    for(const [value,[x,y]] of Object.entries(group.points)){
      targetButtons.push(hit(group.page,[x-23,y-24,46,48],'Nối với '+value,()=>{
        if(!allowed())return;
        if(!pending||pending.link!==name){notify('Bấm chấm tròn bên trái trước.');return}
        const q=pending;removePending();choose(q,value);
      }));
    }
  }

  for(const q of DATA.reviewSlots || []){
    const input=document.createElement('input');
    input.type='text';input.className='worksheet-input review-input';input.maxLength=160;
    input.autocomplete='off';input.setAttribute('aria-label',q.id+' giáo viên chấm');
    input.title='Ô này dành cho giáo viên chấm.';
    pos(input,q.page,q.rect);
    input.onfocus=()=>{closeMenu();removePending();hideFeedback()};
    input.oninput=()=>{
      STATE.reviewAnswers ||= {};
      STATE.reviewAnswers[q.id]=input.value;
      save();
    };
    input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();input.blur()}};
    layers[q.page].append(input);
    reviewInputs[q.id]=input;
  }

  refresh();showPage(STATE.page,false);
}
function update(q){
  const view=views[q.id], value=STATE.answers[q.id], graded=STATE.submitted||STATE.mode==='practice';
  const color=graded?(correct(q,value)?'good':'bad'):'';
  if(view.input){
    const draft=STATE.drafts?.[q.id];
    view.input.readOnly=STATE.submitted;
    view.input.value=draft ?? value ?? '';
    view.input.classList.toggle('good',draft===undefined&&Boolean(value)&&color==='good');
    view.input.classList.toggle('bad',draft===undefined&&Boolean(value)&&color==='bad');
    return;
  }
  view.buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(Boolean(value)&&(q.opts?q.opts[i][0]===value:true))));
  if(view.line){
    const point=TARGETS[q.link].points[value];
    view.line.style.display=point?'':'none';
    if(point){
      view.line.setAttribute('x2',point[0]);view.line.setAttribute('y2',point[1]);
      view.line.setAttribute('stroke',!graded?'#1767b5':correct(q,value)?'#13803c':'#d32936');
    }
    return;
  }
  if(view.lineAnswer){
    view.lineAnswer.hidden=!value;view.lineAnswer.className='mark word '+color;
    view.lineAnswer.textContent=value||'';
  }
  view.marks.forEach((m,i)=>{
    if(!m)return; const selected=Boolean(value)&&(!q.opts||q.opts[i][0]===value);
    m.hidden=!selected;m.className='mark '+(q.opts?q.kind:q.cells?'letter':'word')+' '+color;
    m.textContent=selected?(q.opts?({tick:'✓',cross:'×'}[q.kind]||''):q.cells?(value[i]||''):value):'';
  });
}

function progress(){let n=QUESTIONS.filter(q=>STATE.answers[q.id]).length;$('count').textContent=n+'/'+QUESTIONS.length;$('progress').value=n}function screen(){const show=(STATE.started||STATE.submitted)&&!!(STATE.teacher||'').trim(); $('welcome').hidden=show;document.body.classList.toggle('welcome-active',!show);for(const el of [$('studyHeader'),document.querySelector('main'),document.querySelector('footer'),$('studySide')])el.hidden=!show;}
function refresh(){QUESTIONS.forEach(update);for(const [id,input] of Object.entries(reviewInputs)){input.value=STATE.reviewAnswers?.[id]||'';input.readOnly=STATE.submitted;}progress();$('name').value=STATE.name;$('cls').value=STATE.cls;$('teacher').value=STATE.teacher||'';document.querySelectorAll('[name=studyMode]').forEach(e=>{e.checked=e.value===STATE.mode;e.disabled=false});$('start').textContent=(STATE.started||STATE.submitted)?'Tiếp tục làm bài':'Bắt đầu làm bài';$('submit').disabled=STATE.submitted;$('result').hidden=!STATE.submitted;screen()}
function score(){let right=0,wrong=0,blank=0,sections={};for(const q of QUESTIONS){let a=STATE.answers[q.id],i=!a?2:correct(q,a)?0:1;(sections[q.id[0]] ||= [0,0,0])[i]++;if(i===0)right++;else if(i===1)wrong++;else blank++}return {right,wrong,blank,sections,grade:(right/QUESTIONS.length*10).toFixed(1)}}function report(animate=false){let r=score(),body=$('reportBody');body.replaceChildren();function text(tag,t){let e=document.createElement(tag);e.textContent=t;body.append(e)}const head=document.createElement('section');head.className='reportHead';const identity=document.createElement('div');identity.className='reportIdentity';const logo=$('brandLogo').cloneNode();logo.removeAttribute('id');logo.className='';identity.append(logo);const brand=document.createElement('div');brand.innerHTML='<strong>HT English Center</strong><p>SĐT: 0962240866</p>';identity.append(brand);head.append(identity);const unit=document.createElement('h2');unit.className='reportUnit';unit.textContent=DATA.title;head.append(unit);const grid=document.createElement('div');grid.className='reportGrid';const info=document.createElement('div');info.className='reportInfo';for(const [label,value] of [['Học sinh',STATE.name],['Lớp',STATE.cls],['Giáo viên chủ nhiệm',STATE.teacher||'Chưa cập nhật']]){const p=document.createElement('p');p.textContent=label+': '+value;info.append(p)}grid.append(info);const grade=document.createElement('div');grade.className='redGrade'+(animate===true?' writeOnce':'');const ink=document.createElement('div');ink.className='gradeInk';const n=Number(r.grade);ink.textContent=String(n).replace('.',',');grade.setAttribute('aria-label','Điểm '+ink.textContent+' trên 10');grade.append(ink);grade.insertAdjacentHTML('beforeend','<svg viewBox="0 0 120 22" aria-hidden="true"><path d="M5 8 Q52 1 115 5"/><path d="M10 18 Q62 9 110 14"/></svg>');grid.append(grade);head.append(grid);const comment=document.createElement('p');comment.className='teacherComment';comment.textContent=n>=9?'Excellent! Well done!':n>=8?'Very good!':n>=7?'Good job!':n>=5?'Keep practicing!':'Keep trying! You can do it!';head.append(comment);body.append(head);if(r.right===QUESTIONS.length)text('p','Tuyệt vời! Em đã trả lời đúng tất cả các câu hỏi.');text('p',`Đúng: ${r.right} | Sai: ${r.wrong} | Chưa làm: ${r.blank}`);let table=document.createElement('table');for(const row of [['Bài','Đúng','Sai','Chưa làm'],...Object.entries(r.sections).map(([k,v])=>[k,...v])]){let tr=table.insertRow();row.forEach(x=>tr.insertCell().textContent=x)}body.append(table);text('h3','Giải thích từng câu');for(const q of QUESTIONS){let a=STATE.answers[q.id];text('p',q.id+' – '+(!a?'Chưa trả lời':correct(q,a)?'Đúng':'Sai')+(a?' ('+a+')':'')+'\n'+q.explanation)}if(DATA.reviewSlots?.length){text('h3','Phần giáo viên chấm');for(const q of DATA.reviewSlots){text('p',q.id+' – '+(STATE.reviewAnswers?.[q.id]?.trim()||'Chưa trả lời')+'\n'+q.note)}}$('report').showModal();$('report').scrollTop=0}
for(const id of ['name','cls','teacher'])$(id).oninput=e=>{STATE[id]=e.target.value;save()};document.querySelectorAll('[name=studyMode]').forEach(e=>e.onchange=()=>{if(e.checked){if(e.value!==STATE.mode&&(STATE.submitted||Object.keys(STATE.answers).length)){if(!confirm('Đổi chế độ sẽ bắt đầu bài mới và xóa đáp án cũ. Em có đồng ý không?')){document.querySelectorAll('[name=studyMode]').forEach(r=>r.checked=r.value===STATE.mode);return}const {name,cls,teacher}=STATE;STATE={...fresh(),name,cls,teacher,mode:e.value};hideFeedback();pending=null;closeMenu();showPage(0,false);refresh()}else STATE.mode=e.value;save()}});$('welcomeForm').onsubmit=e=>{e.preventDefault();if(!STATE.name.trim()||!STATE.cls.trim()||!STATE.teacher.trim()){notify('Vui lòng nhập đầy đủ họ tên, lớp và giáo viên chủ nhiệm.');return}STATE.started=true;save();refresh();document.querySelector('main').classList.add('study-enter');window.scrollTo(0,0)};$('submit').onclick=()=>{if(!allowed())return;for(const [id,draft] of Object.entries(STATE.drafts||{})){const q=QUESTIONS.find(item=>item.id===id);if(q){delete STATE.drafts[id];choose(q,draft.trim());}}let r=score();if(!confirm((r.blank?'Còn '+r.blank+' phần chưa làm. ':'')+'Bạn có chắc muốn nộp bài?'))return;hideFeedback();removePending();STATE.submitted=true;STATE.result=r;closeMenu();save();refresh();report(true)};$('result').onclick=()=>report(false);$('reset').onclick=()=>{if(!confirm('Xóa bài làm và kết quả cũ để làm lại?'))return;hideFeedback();let {name,cls,teacher,mode}=STATE;STATE={...fresh(),name,cls,teacher,mode};pending=null;closeMenu();document.querySelectorAll('.pending').forEach(e=>e.classList.remove('pending'));save();refresh();showPage(0,false);window.scrollTo(0,0)};
let visiblePage=-1, pageAnimation=null;
function showPage(index,animate=true){
 const pages=Array.from($('pages').children);index=Number(index);if(!Number.isInteger(index)||index<0||index>=pages.length)index=0;
 const old=visiblePage;closeMenu();if(pageAnimation){pageAnimation.cancel();pageAnimation=null}if(old!==index)removePending();
 pages.forEach((p,i)=>p.hidden=i!==index);visiblePage=index;STATE.page=index;save();
 $('pageStatus').textContent=`Trang ${index+1} / ${pages.length}`;$('prevPage').disabled=index===0;$('nextPage').disabled=index===pages.length-1;
 document.querySelectorAll('[data-page]').forEach(b=>{if(Number(b.dataset.page)===index)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 if(animate&&old!==index&&old>=0){if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&pages[index].animate){const direction=index>old?1:-1;pageAnimation=pages[index].animate([{transform:`translateX(${direction*32}px)`,opacity:.35},{transform:'translateX(0)',opacity:1}],{duration:300,easing:'ease-out'});} $('pages').scrollIntoView({block:'start',behavior:'instant'});}
}
$('prevPage').onclick=()=>showPage(visiblePage-1);$('nextPage').onclick=()=>showPage(visiblePage+1);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(Number(b.dataset.page)));init();
