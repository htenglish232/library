<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HT English - Phiếu bài tập điện tử Grade 4–8</title>

<style>
:root{
    --blue:#0b63ce;
    --navy:#082b5c;
    --sky:#eaf4ff;
    --text:#17324d;
    --muted:#678;
    --shadow:0 12px 30px rgba(8,43,92,.12);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,#f7fbff,#edf6ff);
    color:var(--text);
}

header{
    background:linear-gradient(135deg,var(--navy),var(--blue));
    color:#fff;
    padding:22px 20px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.top{
    max-width:1180px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:16px;
    justify-content:space-between;
    flex-wrap:wrap;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:54px;
    height:54px;
    border-radius:16px;
    background:#fff;
    color:var(--blue);
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:20px;
}

h1{
    font-size:24px;
    margin:0;
}

.sub{
    font-size:13px;
    opacity:.85;
    margin-top:3px;
}

.search{
    flex:1;
    max-width:430px;
    min-width:230px;
}

.search input{
    width:100%;
    padding:13px 16px;
    border:0;
    border-radius:14px;
    font-size:15px;
    outline:none;
}

.hero{
    max-width:1180px;
    margin:28px auto 18px;
    padding:0 20px;
}

.hero-box{
    background:#fff;
    border-radius:24px;
    padding:28px;
    box-shadow:var(--shadow);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.hero h2{
    margin:0 0 8px;
    font-size:30px;
    color:var(--navy);
}

.hero p{
    margin:0;
    color:var(--muted);
    line-height:1.6;
}

.stats{
    white-space:nowrap;
    background:var(--sky);
    padding:14px 18px;
    border-radius:16px;
    font-weight:700;
    color:var(--blue);
}

main{
    max-width:1180px;
    margin:auto;
    padding:0 20px 50px;
}

.grade-tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

.tab{
    border:0;
    background:#fff;
    color:var(--navy);
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
    box-shadow:0 5px 14px rgba(8,43,92,.08);
}

.tab.active{
    background:var(--blue);
    color:#fff;
}

.grade-section{
    display:none;
}

.grade-section.active{
    display:block;
}

.unit{
    background:#fff;
    border-radius:20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.unit-head{
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(90deg,#fff,#f1f7ff);
}

.unit-head h3{
    margin:0;
    color:var(--navy);
}

.badge{
    background:var(--sky);
    color:var(--blue);
    padding:7px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
}

.lessons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:12px;
    padding:0 20px 20px;
}

.lesson{
    display:block;
    text-decoration:none;
    color:var(--text);
    border:1px solid #dceaff;
    border-radius:15px;
    padding:15px;
    background:#fbfdff;
    transition:.2s;
}

.lesson:hover{
    transform:translateY(-2px);
    border-color:#8fc2ff;
    box-shadow:0 8px 18px rgba(11,99,206,.12);
}

.lesson strong{
    display:block;
    margin-bottom:6px;
    color:var(--navy);
}

.lesson small{
    color:var(--muted);
}

.empty{
    display:none;
    text-align:center;
    padding:40px;
    background:#fff;
    border-radius:20px;
}

footer{
    text-align:center;
    color:var(--muted);
    padding:25px;
}

@media(max-width:700px){

    header{
        position:static;
    }

    .hero-box{
        display:block;
    }

    .stats{
        display:inline-block;
        margin-top:16px;
    }

    .hero h2{
        font-size:24px;
    }

    .lessons{
        grid-template-columns:1fr;
    }
}
</style>

</head>

/* =========================
   HỆ THỐNG HIỂN THỊ
========================= */

const tabs = document.getElementById("tabs");
const content = document.getElementById("content");
const search = document.getElementById("search");
const empty = document.getElementById("empty");

let active = DATA[0]?.grade || "";


/* ĐẾM TỔNG SỐ BÀI */

const total = DATA.reduce(

(n,g) =>
n + g.units.reduce(
(m,u) => m + u.lessons.length,
0
),

0

);

document.getElementById("stats").textContent =
`${DATA.length} khối • ${total} bài học`;


/* =========================
   RENDER
========================= */

function render(q=""){

tabs.innerHTML="";
content.innerHTML="";

let visible=0;


DATA.forEach(g=>{


/* TAB GRADE */

const b=document.createElement("button");

b.className=
"tab " +
(g.grade===active ? "active" : "");

b.textContent=g.grade;


b.onclick=()=>{

active=g.grade;

render(search.value);

};


tabs.appendChild(b);



/* SECTION */

const sec=document.createElement("section");

sec.className=
"grade-section " +
(g.grade===active ? "active" : "");



g.units.forEach(u=>{


const lessons=u.lessons.filter(l=>

(
g.grade+" "+
u.name+" "+
l.title
)

.toLowerCase()

.includes(q.toLowerCase())

);


if(!lessons.length)return;


visible+=lessons.length;


/* UNIT BOX */

const box=document.createElement("div");

box.className="unit";


box.innerHTML=`

<div class="unit-head">

<h3>${u.name}</h3>

<span class="badge">
${lessons.length} bài
</span>

</div>

<div class="lessons"></div>

`;


const list=
box.querySelector(".lessons");



/* LESSON */

lessons.forEach((l,i)=>{


const a=document.createElement("a");

a.className="lesson";


/*
Tự động xử lý đường dẫn tương đối
khi chạy bằng GitHub Pages
*/

a.href = new URL(l.href, window.location.href).href;


a.innerHTML=`

<strong>
${i+1}. ${l.title}
</strong>

<small>
Mở bài học →
</small>

`;


list.appendChild(a);

});


sec.appendChild(box);


});


content.appendChild(sec);


});


empty.style.display=
visible ? "none" : "block";

}


/* SEARCH */

search.addEventListener(
"input",
e => render(e.target.value.trim())
);


/* START */

render();
